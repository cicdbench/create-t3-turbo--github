name: CI
on:
  pull_request:
    branches:
      - "*"
    types:
      - opened
      - synchronize
      - reopened
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-cicdbench-github-gate-r0
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  FORCE_COLOR: 3
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Copy env
        shell: bash
        run: cp .env.example .env
      - name: Lint
        run: pnpm lint && pnpm lint:ws
    timeout-minutes: 30
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Format
        run: pnpm format
    timeout-minutes: 30
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup
        uses: ./tooling/github/setup
      - name: Typecheck
        run: pnpm typecheck
    timeout-minutes: 30
